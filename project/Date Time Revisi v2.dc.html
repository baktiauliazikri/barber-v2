<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#ffffff; font-family:'Archivo',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#0b0b0b; } a:hover { color:#5c5c5c; }
  * { box-sizing:border-box; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;justify-content:center;padding:32px 16px;background:#ffffff">
<div style="width:390px;max-width:100%;background:#ffffff;border:1px solid #0b0b0b;display:flex;flex-direction:column;height:844px;overflow:hidden">

  <div style="display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #0b0b0b;flex-shrink:0">
    <div style="width:28px;height:28px;border:1px solid #0b0b0b;display:flex;align-items:center;justify-content:center;font-size:13px;color:#0b0b0b;cursor:pointer;flex-shrink:0" style-hover="background:#f5f5f5">←</div>
    <div style="flex:1;min-width:0">
      <div style="font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.14em;color:#0b0b0b;line-height:1">KONTUR</div>
      <div style="font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.26em;color:#8c8c8c;margin-top:4px">BARBER ATELIER</div>
    </div>
    <div style="width:28px;height:28px;background:#0b0b0b;display:flex;align-items:center;justify-content:center;color:#ffffff;font-family:'Space Mono',monospace;font-size:10px;flex-shrink:0">AR</div>
  </div>

  <div style="padding:12px 18px;border-bottom:1px solid #d4d4d4;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      <div style="display:flex;gap:3px;flex:1">
        <div style="height:3px;flex:1;background:#0b0b0b"></div>
        <div style="height:3px;flex:1;background:#0b0b0b"></div>
        <div style="height:3px;flex:1;background:#0b0b0b"></div>
        <div style="height:3px;flex:1;background:#0b0b0b"></div>
        <div style="height:3px;flex:1;background:#e2e2e2"></div>
      </div>
      <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:#5c5c5c">04/05</div>
    </div>
    <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;color:#5c5c5c">KEMANG · ANDI PRATAMA · SIGNATURE CUT 45 MIN</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:20px 18px">
    <h1 style="font-family:'Archivo Black',sans-serif;font-size:30px;font-weight:400;line-height:1;margin:0 0 12px;color:#0b0b0b;letter-spacing:-.02em;text-transform:uppercase">Pilih jadwal</h1>
    <p style="font-size:14px;line-height:1.5;color:#4a4a4a;margin:0 0 18px;max-width:32ch">Semua jam dalam WIB. Durasi 45 menit.</p>

    <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #0b0b0b;margin-bottom:12px">
      <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;color:#0b0b0b">OKTOBER 2026</div>
      <div style="display:flex;gap:5px">
        <div style="width:26px;height:26px;border:1px solid #d4d4d4;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8c8c8c;cursor:pointer">‹</div>
        <div style="width:26px;height:26px;border:1px solid #0b0b0b;display:flex;align-items:center;justify-content:center;font-size:12px;color:#0b0b0b;cursor:pointer" style-hover="background:#f5f5f5">›</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:22px">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <div onClick="{{ d.select }}" style="{{ d.style }}">
          <div style="{{ d.dowStyle }}">{{ d.dow }}</div>
          <div style="{{ d.numStyle }}">{{ d.num }}</div>
          <div style="{{ d.countStyle }}">{{ d.count }}</div>
        </div>
      </sc-for>
    </div>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="margin-bottom:18px">
        <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.22em;color:#5c5c5c;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid #d4d4d4">{{ g.label }}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
          <sc-for list="{{ g.slots }}" as="s" hint-placeholder-count="3">
            <div onClick="{{ s.select }}" style="{{ s.style }}">{{ s.time }}</div>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="height:8px"></div>
  </div>

  <div style="flex-shrink:0;border-top:1px solid #0b0b0b;background:#ffffff;padding:11px 18px 16px">
    <div style="display:flex;align-items:center;gap:8px;padding:8px 11px;background:#e8f2ec;margin-bottom:11px">
      <div style="width:6px;height:6px;border-radius:50%;background:#1a7a4f;flex-shrink:0"></div>
      <div style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:#1a7a4f;flex:1">SLOT DITAHAN UNTUK KAMU</div>
      <div style="font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:#1a7a4f;letter-spacing:.06em">{{ hold }}</div>
    </div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;gap:10px">
      <div style="font-size:14px;font-weight:700;color:#0b0b0b;min-width:0">{{ summary }}</div>
      <div style="font-family:'Archivo Black',sans-serif;font-size:20px;color:#0b0b0b;line-height:1;white-space:nowrap;letter-spacing:-.02em">Rp 120.000</div>
    </div>
    <div style="background:#0b0b0b;color:#ffffff;height:52px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.18em;cursor:pointer" style-hover="background:#2b2b2b">LANJUT ISI DATA DIRI</div>
  </div>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:422,&quot;height&quot;:908}}">
const DOW = ['SEN','SEL','RAB','KAM','JUM','SAB','MIN'];
const DAY_NUMS = [12, 13, 14, 15, 16, 17, 18];
const SLOTS = {
  14: { pagi:['10:00','10:45'], siang:['13:00','14:00','15:00','16:30'], malam:['19:00','20:00'] },
  12: { pagi:['09:15'], siang:['13:30'], malam:['19:30'] },
  13: { pagi:['10:00','11:30'], siang:['14:00','16:00'], malam:['20:00'] },
  15: { pagi:['10:15'], siang:['13:00','15:45'], malam:['19:00'] },
  16: { pagi:['11:00'], siang:['16:00'], malam:[] },
  17: { pagi:['09:00','10:30'], siang:['13:15','14:45'], malam:['18:30','20:15'] },
  18: { pagi:[], siang:[], malam:[] }
};
const LABELS = { pagi:'PAGI · 09:00–12:00', siang:'SIANG · 13:00–17:00', malam:'MALAM · 18:00–21:00' };

class Component extends DCLogic {
  state = { day:14, time:'14:00', left:597 };

  componentDidMount() {
    this.t = setInterval(() => this.setState(s => ({ left: s.left > 0 ? s.left - 1 : 0 })), 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }

  renderVals() {
    const { day, time, left } = this.state;
    const m = Math.floor(left/60), sec = left % 60;
    const data = SLOTS[day] || { pagi:[], siang:[], malam:[] };

    return {
      hold: `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`,
      summary: (() => {
        const full = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'][DAY_NUMS.indexOf(day)];
        return time ? `${full}, ${day} Okt · ${time}` : `${full}, ${day} Okt · pilih jam`;
      })(),
      days: DAY_NUMS.map((num,i) => {
        const on = num === day;
        const s = SLOTS[num] || { pagi:[], siang:[], malam:[] };
        const n = s.pagi.length + s.siang.length + s.malam.length;
        const none = n === 0;
        return {
          num, dow: DOW[i],
          count: none ? '—' : n,
          select: () => { if (!none) this.setState({ day:num, time:null }); },
          style: `padding:7px 2px;text-align:center;cursor:${none?'default':'pointer'};transition:all .16s ease;border:1px solid ${on?'#0b0b0b':'#d4d4d4'};background:${on?'#0b0b0b':'#ffffff'};opacity:${none?.4:1}`,
          dowStyle: `font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:${on?'#9c9c9c':'#5c5c5c'}`,
          numStyle: `font-family:'Archivo Black',sans-serif;font-size:15px;margin-top:3px;line-height:1;color:${on?'#ffffff':'#0b0b0b'}`,
          countStyle: `font-family:'Space Mono',monospace;font-size:9.5px;margin-top:4px;color:${on?'#9c9c9c':'#5c5c5c'}`
        };
      }),
      groups: ['pagi','siang','malam'].filter(k => data[k].length).map(k => ({
        label: LABELS[k],
        slots: data[k].map(t => {
          const on = t === time;
          return {
            time: t,
            select: () => this.setState({ time:t, left:597 }),
            style: `padding:13px 4px;text-align:center;font-family:'Space Mono',monospace;font-size:13.5px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:all .16s ease;border:1px solid ${on?'#0b0b0b':'#d4d4d4'};background:${on?'#0b0b0b':'#ffffff'};color:${on?'#ffffff':'#0b0b0b'}`
          };
        })
      }))
    };
  }
}

</script>
</body>
</html>
